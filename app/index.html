<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>TGG</title>

<style>
:root{
  --color-bg:#FFFFFF;--color-surface:#F1F4F7;--color-text:#0E1A24;--color-divider:#DCE3EA;
  --color-accent:#13263A;--color-accent-100:#F6EEDB;--color-accent-200:#EBDCB4;--color-accent-600:#1D3A55;
  --color-accent-700:#94742C;--color-accent-800:#13263A;
  --color-neutral-300:#DCE3EA;--color-neutral-400:#B8C3CE;--color-neutral-600:#7A8793;--color-neutral-700:#55626E;--color-neutral-800:#3A4752;
  --color-error:#9B2C2C;
  --font-heading:Archivo,system-ui,sans-serif;--font-body:Archivo,system-ui,sans-serif;
  --font-mono:ui-monospace,Menlo,monospace;
  --radius-card:16px;--radius-button:12px;
  --safe-bottom:env(safe-area-inset-bottom);
}
html,body{margin:0;height:100%}
body{background:var(--color-bg);overflow:hidden;font-family:var(--font-body);color:var(--color-text);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border-radius:var(--radius-button)}
input{border-radius:0}
h1{font-stretch:80%;font-weight:780;letter-spacing:-.025em}
.hd{font-family:var(--font-heading);font-stretch:84%;font-weight:700}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;height:100dvh;display:flex;flex-direction:column;background:var(--color-bg);padding-top:max(env(safe-area-inset-top),14px);box-sizing:border-box}
.screen-pad{flex:1;display:flex;flex-direction:column;padding:12px 24px calc(var(--safe-bottom) + 24px)}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 20px 20px}
.col{flex:1;display:flex;flex-direction:column;min-height:0}

/* Shared pieces */
.wordmark{font-size:22px;letter-spacing:.04em}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)}
.eyebrow-sm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)}
.label-xs{font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.section-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700);margin-bottom:4px}
.photo{border:1px solid var(--color-divider);border-radius:var(--radius-card);overflow:hidden;position:relative;background:repeating-linear-gradient(135deg,var(--color-accent-200) 0 10px,var(--color-accent-100) 10px 20px);display:flex;align-items:flex-end;padding:12px}
.photo span{font:11px var(--font-mono);color:var(--color-accent-800)}
.btn-primary{height:54px;background:var(--color-accent);color:#fff;border:1px solid var(--color-accent);font-size:20px;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-primary:active{background:var(--color-accent-700)}
.link-btn{background:none;border:0;color:var(--color-accent-700);cursor:pointer;padding:10px 0}
.card{border:1px solid var(--color-divider);border-radius:var(--radius-card);overflow:hidden;position:relative}
.box{border:1px solid var(--color-divider)}
.lead{font-size:17px;line-height:1.45;color:var(--color-neutral-800);margin:0}
.h1-xl{font-size:46px;margin:6px 0 10px}
.h1-l{font-size:40px;margin:0}

/* Login */
.login .photo{margin:28px 6px 0;height:150px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--color-neutral-700)}
.field input{height:48px;border:1px solid var(--color-divider);background:var(--color-surface);padding:0 12px;font:inherit;font-size:17px;color:var(--color-text);outline:none}
.login-err{color:var(--color-error);font-size:14px}
.demo-hint{font-size:12px;color:var(--color-neutral-600);line-height:1.6;margin-top:14px;text-align:center}

/* Onboarding */
.ob-photo{margin:28px 6px 0;flex:1;max-height:300px}
.ob-install{margin:22px 0 0;flex:1;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;border:1px solid var(--color-divider);border-radius:var(--radius-card);padding:12px 14px}
.step-n{width:38px;height:38px;flex:none;border-radius:50%;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.step-t{font-size:15px;line-height:1.35}
.sub{color:var(--color-neutral-700);font-size:13px}
.pill-switch{width:40px;height:22px;border-radius:99px;position:relative;flex:none;background:var(--color-neutral-400)}
.pill-switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff}
.pill-switch.on{background:var(--color-accent)}
.pill-switch.on::after{left:20px}
.dots{display:flex;gap:6px;margin:26px 0 18px}
.dots div{height:3px;width:14px;background:var(--color-neutral-400)}
.dots .done{background:var(--color-accent)}
.dots .cur{width:28px}

/* Home */
.home-head{display:flex;justify-content:space-between;align-items:flex-end}
.hello{font-size:14px;color:var(--color-neutral-700)}
.avatar-sm{width:42px;height:42px;border:1px solid var(--color-divider);display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--color-accent-100);color:var(--color-accent-800)}
.next{margin:22px 6px 6px;padding:16px;cursor:pointer}
.next-row{display:flex;gap:14px;margin-top:8px;align-items:center}
.next-date{text-align:center;border-right:1px solid var(--color-divider);padding-right:14px}
.next-day{font-size:38px;line-height:1}
.next-mon{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.next-title{font-size:23px;line-height:1.1}
.meta{font-size:13px;color:var(--color-neutral-700)}
.next-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.next-foot b{font-size:14px;color:var(--color-accent-700);font-weight:500}
.seg{display:flex;border:1px solid var(--color-divider);margin:22px 0 14px}
.seg button{flex:1;padding:9px 0;font-size:14px;border:0;cursor:pointer;background:transparent;color:var(--color-text)}
.seg button.on{background:var(--color-accent);color:#fff}
.feed{display:flex;flex-direction:column;gap:12px}
.post{border:1px solid var(--color-divider);padding:14px;display:flex;flex-direction:column;gap:6px}
.post img{width:100%;max-height:200px;object-fit:contain;background:var(--color-surface);border:1px solid var(--color-divider);margin-bottom:6px}
.post-meta{display:flex;justify-content:space-between}
.post-meta span:first-child{color:var(--color-accent-700)}
.post-meta span:last-child{color:var(--color-neutral-600)}
.post-title{font-size:21px;line-height:1.15}
.post-text{font-size:14px;line-height:1.45;color:var(--color-neutral-800)}

/* Termine */
.ev-head{padding:12px 20px 0}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--color-divider);background:var(--color-surface);padding:0 12px;height:44px;color:var(--color-neutral-700)}
.searchbox input{flex:1;min-width:0;-webkit-appearance:none;appearance:none;border:0;background:transparent;font:inherit;font-size:16px;outline:none;color:var(--color-text)}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 14px;font-size:14px;cursor:pointer;border:1px solid var(--color-divider);background:transparent;color:var(--color-text)}
.chips button.on{border-color:var(--color-accent);background:var(--color-accent);color:#fff}
.ev-list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 20px 20px}
.empty{padding:40px 0;text-align:center;color:var(--color-neutral-700)}
.ev{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--color-divider);cursor:pointer;align-items:center}
.ev-date{width:54px;text-align:center;flex:none}
.ev-day{font-size:30px;line-height:1}
.ev-mon{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-neutral-700)}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:20px;line-height:1.15}
.tag{font-size:11px;padding:3px 8px;border:1px solid var(--color-divider);color:var(--color-accent-800);background:transparent;white-space:nowrap}
.tag.full{color:var(--color-neutral-700)}
.tag.mine{border-color:var(--color-accent);background:var(--color-accent);color:#fff}

/* Detail */
.detail .scroll{padding:8px 20px 20px}
.back{display:flex;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--color-accent-700);font-size:16px;padding:8px 0}
.detail .photo{margin:8px 6px 0;height:170px;padding:10px}
.detail .eyebrow-sm{margin-top:20px}
.detail h1{font-size:38px;margin:4px 0 14px}
.facts{display:flex;flex-direction:column;gap:10px;font-size:15px}
.facts div{display:flex;gap:10px;align-items:center}
.facts svg{color:var(--color-accent-700)}
.desc{font-size:16px;line-height:1.5;margin:18px 0;color:var(--color-neutral-800)}
.cap{border:1px solid var(--color-divider);padding:14px}
.cap-row{display:flex;justify-content:space-between;font-size:14px}
.cap-row span:last-child{font-weight:500}
.bar{height:4px;background:var(--color-neutral-300);margin:8px 0 12px}
.bar div{height:4px;background:var(--color-accent)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{height:34px;padding:0 10px;border:1px solid var(--color-divider);display:flex;align-items:center;font-size:13px;background:var(--color-accent-200);color:var(--color-accent-800)}
.person:nth-child(even){background:var(--color-accent-100)}
.none{font-size:13px;color:var(--color-neutral-600)}
.action-bar{padding:12px 20px calc(var(--safe-bottom) + 12px);border-top:1px solid var(--color-divider);background:var(--color-bg)}
.btn-reg{width:100%;height:54px;cursor:pointer;font-size:20px;border:1px solid var(--color-accent);background:var(--color-accent);color:#fff}
.btn-reg.out{background:transparent;color:var(--color-accent-700)}

/* Mitteilungen */
.notif-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px}
.notif-head .link-btn{font-size:14px;padding:8px 0}
.notif{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--color-divider);cursor:pointer}
.unread-dot{width:8px;height:8px;margin-top:7px;flex:none;border-radius:50%;background:transparent}
.notif.unread .unread-dot{background:var(--color-accent)}
.notif-body{flex:1}
.notif-meta{display:flex;justify-content:space-between;color:var(--color-neutral-700)}
.notif-title{font-size:20px;line-height:1.15;margin:2px 0}
.notif-text{font-size:14px;color:var(--color-neutral-800);line-height:1.4}

/* Profil */
.profile h1{font-size:40px;margin:0 0 18px}
.me{margin:0 6px;padding:18px;display:flex;gap:16px;align-items:center}
.avatar-lg{width:64px;height:64px;background:var(--color-accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.me-name{font-size:26px;line-height:1.1}
.me-nr{font-size:12px;color:var(--color-accent-700);margin-top:4px;font-family:var(--font-mono)}
.rows{border:1px solid var(--color-divider);margin:22px 0 0}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;border-bottom:1px solid var(--color-divider);font-size:15px}
.rows span:first-child{color:var(--color-neutral-600)}
.rows span:last-child{text-align:right}
.mail-btn{display:block;box-sizing:border-box;text-align:center;line-height:46px;height:48px;margin-top:12px;border:1px solid var(--color-accent);color:var(--color-text);text-decoration:none;font-size:18px}
.fine{font-size:12px;color:var(--color-neutral-600);line-height:1.5;margin-top:8px}
.admin-link{display:block;text-align:center;margin:10px 0 22px;padding:14px;border:1px solid var(--color-divider);font-size:15px;color:var(--color-accent-700);text-decoration:none}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-divider);font-size:15px}
.list-row.link{cursor:pointer}
.list-row.link span:last-child{color:var(--color-neutral-700)}
.muted{font-size:14px;color:var(--color-neutral-700);padding:10px 0}
.sq-switch{width:40px;height:22px;border:1px solid var(--color-accent);background:transparent;position:relative;cursor:pointer;flex:none}
.sq-switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--color-neutral-600)}
.sq-switch.on{background:var(--color-accent)}
.sq-switch.on::after{left:22px;background:#fff}
.logout{width:100%;height:48px;margin-top:22px;border:1px solid var(--color-divider);background:transparent;color:var(--color-accent-700);font-size:18px;cursor:pointer}

/* Tab-Leiste */
.tabs{display:flex;border-top:1px solid var(--color-divider);background:var(--color-bg);padding:8px 8px calc(var(--safe-bottom) + 6px)}
.tabs button{flex:1;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--color-neutral-600);padding:6px 0;position:relative}
.tabs button.on{color:var(--color-accent-700)}
.tabs span{font-size:11px}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;background:var(--color-accent-700);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
</style>
</head>

/* ---------- Hilfsfunktionen ---------- */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const deD = d => { const [y, m, t] = d.split('-'); return t + '.' + m + '.' + y; };
const parseD = s => { const m = (s || '').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : null; };
// Nur Ziffern eingeben, die Punkte setzt die App: „14031985“ → „14.03.1985“. Ein Punkt kommt erst mit der nächsten Ziffer, damit Löschen normal funktioniert.
const formatBirth = v => { const d = v.replace(/\D/g, '').slice(0, 8); return d.length > 4 ? d.slice(0, 2) + '.' + d.slice(2, 4) + '.' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '.' + d.slice(2) : d; };
const clean = t => (t || '').replace(/­/g, '').replace(/\s+/g, ' ').trim();

/* ---------- Speicher ----------
   Gleiche Schlüssel wie die Verwaltung (/verwaltung/), damit beide auf derselben Domain dieselben Daten sehen.
   tgg_db_v1 legt nur die Verwaltung an; die App schreibt nur hinein, wenn es ihn schon gibt. */
const KEY = { session: 'tgg_session_v1', db: 'tgg_db_v1', obSeen: 'tgg_ob_seen', web: 'tgg_web_cache', prefs: 'tgg_prefs_v1' };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  json(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
};
function loadDb() {
  const d = store.json(KEY.db);
  return d && d.members ? d : { members: MEMBERS, work: WORK0, pushes: [] };
}
function saveDb(db) {
  if (store.get(KEY.db)) store.set(KEY.db, JSON.stringify(db));
  S.db = db;
}
function savePrefs() { store.set(KEY.prefs, JSON.stringify({ read: S.read, push: S.push, mail: S.mail })); }

/* ---------- Zustand ---------- */
const prefs = store.json(KEY.prefs) || {};
const S = {
  screen: store.get(KEY.session) ? 'start' : 'login',
  ses: store.get(KEY.session),
  db: loadDb(),
  web: store.json(KEY.web) || [],
  ln: '', lb: '', loginErr: '',
  ob: 0, feed: 'Alle', q: '', cat: 'Alle', sel: 'e1',
  read: prefs.read || { 3: true, 4: true },
  push: prefs.push !== undefined ? prefs.push : true,
  mail: !!prefs.mail
};
if (S.screen === 'start' && !me()) { S.screen = 'login'; S.ses = null; }

/* ---------- Abgeleitete Daten ---------- */
function me() { return S.db.members.find(m => m.nummer === S.ses); }
function shortName(nr) {
  const m = S.db.members.find(x => x.nummer === nr);
  if (!m) return nr;
  const p = m.name.split(' ');
  return p.length > 1 ? p[0] + ' ' + p[p.length - 1][0] + '.' : m.name;
}
function workEvents() {
  const m = me();
  return (S.db.work || []).map(w => {
    const mine = !!m && w.signups.includes(m.nummer);
    const taken = w.signups.filter(n => !m || n !== m.nummer).length;
    return {
      id: 'w_' + w.id, wid: w.id, work: true, mine, signups: w.signups, cat: 'Arbeitsstunden', title: w.title,
      day: w.date.slice(8), month: MON3[+w.date.slice(5, 7) - 1],
      long: new Date(w.date + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
      time: w.time || 'Uhrzeit folgt', place: w.place, spots: w.spots || 0, taken,
      note: w.spots ? Math.max(0, w.spots - taken - (mine ? 1 : 0)) + ' Plätze frei' : 'Anmeldung offen',
      desc: (w.desc || '') + ' ' + WORK_FEE_NOTE
    };
  });
}
function staticEvent(e) {
  const m = me(), su = (S.db.regs || {})[e.id] || [];
  if (e.noSignup) return { ...e, signups: [], mine: false, taken: 0 };
  return { ...e, signups: su, mine: !!m && su.includes(m.nummer), taken: su.filter(n => !m || n !== m.nummer).length };
}
function allEvents() { return [...EVENTS.map(staticEvent), ...workEvents()]; }
function findEvent(id) { const all = allEvents(); return all.find(e => e.id === id) || all[0]; }
function regLabel(e) { return e.noSignup ? 'Info' : e.mine ? 'Angemeldet' : e.spots ? (e.taken >= e.spots ? 'Ausgebucht' : (e.spots - e.taken) + ' frei') : 'Anmelden'; }
function notifications() {
  const work = S.db.work || [];
  const pushes = (S.db.pushes || []).map(p => {
    const w = /^Arbeitseinsatz/.test(p.title) ? work.find(x => 'Arbeitseinsatz: ' + x.title === p.title) : null;
    return { id: p.id, kind: p.auto ? 'Neu' : 'Mitteilung', when: deD(p.date), title: p.title, text: p.text, ev: w ? 'w_' + w.id : undefined };
  });
  return [...pushes, ...NOTIFS];
}
// Termindatum aus Website-Texten wie „Samstag, 10. Oktober 2026, 18:00 Uhr“ oder „Ende 2026“ (für die Sortierung).
const MONTHS_LONG = ['januar', 'februar', 'märz', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'dezember'];
// Datum (JJJJ-MM-TT) aus Texten wie „Samstag, 10. Oktober 2026, 18:00 Uhr“, „3. Okt“ oder „Ende 2026“ – für die Sortierung im Feed.
// Fehlt die Jahreszahl, gilt fallbackYear. Ohne erkennbares Datum: null.
function sortKey(text, fallbackYear, last) {
  const t = clean(text).replace(/\u00a0/g, ' ').toLowerCase();
  const m = t.match(/(\d{1,2})\.\s*(?:und\s+\D*?(\d{1,2})\.\s*)?([a-zä]+)\.?(?:\s+(\d{4}))?/);
  const mon = m ? MONTHS_LONG.findIndex(x => x === m[3] || (m[3].length >= 3 && x.startsWith(m[3]))) : -1;
  const year = m && (m[4] || fallbackYear);
  // Bei „18. und 25. April“ zählt zum Sortieren der erste Tag, zum Ausblenden (last) der letzte.
  if (mon >= 0 && year) return year + '-' + String(mon + 1).padStart(2, '0') + '-' + ((last && m[2]) || m[1]).padStart(2, '0');
  const iso = t.match(/^(\d{4})-(\d{2})-(\d{2})$/) || t.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (iso) return iso[1].length === 4 ? iso[0] : iso[3] + '-' + iso[2] + '-' + iso[1];
  const end = t.match(/ende\s+(\d{4})/);
  return end ? end[1] + '-12-31' : null;
}
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function feedItems() {
  const news = S.db.news, year = String(new Date().getFullYear()), today = todayKey();
  // Website-Termine, deren (letzter) Tag vorbei ist, werden ausgeblendet. News bleiben, sie sortieren nach Einstellungsdatum.
  const upcoming = n => n.kind !== 'Website' || !n.end || n.end >= today;
  const items = [
    ...S.web.filter(w => !(news || []).some(n => n.orig === w.title))
      .map(w => ({ kind: 'Website', when: w.date, title: w.title, text: w.sub || w.text, img: w.image, k: sortKey(w.date), end: sortKey(w.date, null, true) })),
    ...(news ? news.map(n => ({ kind: n.orig ? 'Website' : 'News', when: n.when || deD(n.date), title: n.title, text: n.text, img: n.img,
        k: sortKey(n.when || '', (n.date || '').slice(0, 4) || year) || n.date || null,
        end: n.orig ? sortKey(n.when || '', (n.date || '').slice(0, 4) || year, true) : null }))
      : NEWS.map(n => ({ ...n, k: sortKey(n.when, year) })))
  ];
  // Alle Beiträge (Website, News, Aktionen) zeitlich aufsteigend wie auf der Startseite; Einträge ohne Datum (z. B. „Immer“) ans Ende.
  return items.filter(upcoming).map((n, i) => ({ n, i }))
    .sort((a, b) => (a.n.k && b.n.k ? a.n.k.localeCompare(b.n.k) : a.n.k ? -1 : b.n.k ? 1 : 0) || a.i - b.i)
    .map(x => x.n)
    .filter(n => S.feed === 'Alle' || n.kind === S.feed);
}

function vEventList() {
  const q = S.q.trim().toLowerCase();
  const res = allEvents().filter(e => !HIDDEN_CATS.includes(e.cat) && (S.cat === 'Alle' || e.cat === S.cat) && (!q || (e.title + e.place + e.cat).toLowerCase().includes(q)));
  if (!res.length) return `<div class="empty">Keine Treffer für „${esc(S.q)}“.</div>`;
  return res.map(e => {
    const full = e.spots && e.taken >= e.spots;
    return `<div class="ev" data-act="open" data-id="${esc(e.id)}">
      <div class="ev-date"><div class="hd ev-day">${esc(e.day)}</div><div class="ev-mon">${esc(e.month)}</div></div>
      <div class="ev-body"><div class="eyebrow-sm" style="letter-spacing:.1em">${esc(e.cat)}</div><div class="hd ev-title">${esc(e.title)}</div><div class="meta">${esc(e.time)} · ${esc(e.place)}</div></div>
      <div class="tag${e.mine ? ' mine' : full ? ' full' : ''}">${esc(regLabel(e))}</div>

  }).join('');
}

function initials(m) { return m.name.split(' ').map(w => w[0]).join('').slice(0, 2); }

/* ---------- Rendern ---------- */
const VIEWS = { login: vLogin, ob: vOnboarding, start: vHome, events: vEvents, detail: vDetail, notif: vNotif, profile: vProfile };
const app = document.getElementById('app');
let lastScreen = null;
function render() {
  // Scrollposition halten, solange der Screen gleich bleibt (z. B. beim Umschalten eines Filters).
  const sc = app.querySelector('.scroll, .ev-list');
  const top = S.screen === lastScreen && sc ? sc.scrollTop : 0;
  app.innerHTML = VIEWS[S.screen]() + (S.screen !== 'login' && S.screen !== 'ob' ? vTabs() : '');
  const sc2 = app.querySelector('.scroll, .ev-list');
  if (sc2) sc2.scrollTop = top;
  lastScreen = S.screen;
}
function set(patch) { Object.assign(S, patch); render(); }

/* ---------- Aktionen ---------- */
function finishOnboarding() { store.set(KEY.obSeen, '1'); set({ screen: 'start' }); }
function doLogin() {
  const b = parseD(S.lb);
  const m = S.db.members.find(x => x.nummer === S.ln.trim() && b && x.birth === b);
  if (!m) return set({ loginErr: 'Mitgliedsnummer oder Geburtsdatum stimmt nicht.' });
  store.set(KEY.session, m.nummer);
  // „Zuletzt in der App“ – die Verwaltung listet damit angemeldete und nicht angemeldete Mitglieder.
  saveDb({ ...S.db, members: S.db.members.map(x => x.nummer === m.nummer ? { ...x, seen: new Date().toISOString().slice(0, 10) } : x) });
  set({ ses: m.nummer, loginErr: '', ln: '', lb: '', screen: store.get(KEY.obSeen) ? 'start' : 'ob', ob: 0 });
}
function toggleReg() {
  const e = findEvent(S.sel), m = me(), db = S.db, reg = e.mine;
  if (!m || e.noSignup) return;
  if (e.work) {
    const w = (db.work || []).find(x => x.id === e.wid);
    if (!w) return;
    if (reg && !confirm('Abmeldung vom Arbeitseinsatz\n\n' + WORK_FEE_NOTE + ' Trotzdem abmelden?')) return;
    saveDb({ ...db, work: db.work.map(x => x.id === w.id ? { ...x, signups: reg ? x.signups.filter(n => n !== m.nummer) : [...x.signups, m.nummer] } : x) });
  } else {
    const cur = (db.regs || {})[e.id] || [];
    saveDb({ ...db, regs: { ...(db.regs || {}), [e.id]: reg ? cur.filter(n => n !== m.nummer) : [...cur, m.nummer] } });
  }
  render();
}
const ACT = {
  go: d => set({ screen: d.id, ob: 0 }),
  open: d => set({ screen: 'detail', sel: d.id }),
  feed: d => set({ feed: d.id }),
  cat: d => set({ cat: d.id }),
  skipOb: finishOnboarding,
  nextOb: () => S.ob === 3 ? finishOnboarding() : set({ ob: S.ob + 1 }),
  toggle: d => { S[d.key] = !S[d.key]; savePrefs(); render(); },
  toggleReg,
  notif: d => {
    const n = notifications().find(x => String(x.id) === d.id);
    if (!n) return;
    S.read = { ...S.read, [n.id]: true }; savePrefs();
    n.ev ? set({ screen: 'detail', sel: n.ev }) : render();
  },
  readAll: () => { S.read = Object.fromEntries(notifications().map(n => [n.id, true])); savePrefs(); render(); },
  logout: () => { store.del(KEY.session); set({ ses: null, screen: 'login' }); }
};
app.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el.dataset);
});
app.addEventListener('submit', ev => { ev.preventDefault(); if (ev.target.dataset.form === 'login') doLogin(); });
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.name === 'ln') S.ln = t.value;
  else if (t.name === 'lb') S.lb = t.value = formatBirth(t.value);
  else if (t.dataset.input === 'q') { S.q = t.value; document.getElementById('ev-list').innerHTML = vEventList(); }
});

/* ---------- Ankündigungen der Website ----------
   Die App liegt unter /app/ auf derselben Domain wie die Website und liest die Startseite direkt.
   Fallback: Netlify-Funktion /.netlify/functions/ankuendigungen. Die letzte Antwort wird zwischengespeichert. */
function loadWebItems() {
  const done = items => {
    if (!items || !items.length) return;
    S.web = items; store.set(KEY.web, JSON.stringify(items));
    if (S.screen === 'start') render();
  };
  fetch('/').then(r => r.ok ? r.text() : Promise.reject()).then(html => {
    const doc = new DOMParser().parseFromString(html, 'text/html'), items = [];
    doc.querySelectorAll('img[src*="img/events/"]').forEach((img, i) => {
      let c = img.parentElement;
      while (c && !c.querySelector('h3')) c = c.parentElement;
      if (!c) return;
      const title = clean(c.querySelector('h3').textContent);
      const leaf = [...c.querySelectorAll('*')].filter(n => !n.children.length).map(n => clean(n.textContent)).filter(Boolean);
      const date = leaf.find(x => /(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag|Ende \d{4})/.test(x)) || '';
      const ps = [...c.querySelectorAll('p')].map(p => clean(p.textContent)).filter(x => x && x !== date);
      if (!items.some(x => x.title === title)) items.push({ id: 'w' + i, title, date, sub: ps[0] || '', text: ps[1] || ps[0] || '', image: new URL(img.getAttribute('src'), location.origin + '/').href });
    });
    if (items.length) done(items); else return Promise.reject();
  }).catch(() => fetch('/.netlify/functions/ankuendigungen').then(r => r.ok ? r.json() : null).then(d => d && done(d.items)).catch(() => {}));
}

render();
loadWebItems();
</script>
