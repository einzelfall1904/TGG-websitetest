# Jeden Dienstag (Spielergebnisse stehen spätestens montags in nuLiga): Mannschaften, Tabellenstand und Links aus nuLiga in mannschaften.html übernehmen.
# Gibt es eine Änderung, wird sie gespeichert – Netlify veröffentlicht die Website daraufhin neu.
# Von Hand starten: GitHub → Actions → „Mannschaften aus nuLiga“ → „Run workflow“.
name: Mannschaften aus nuLiga

on:
  schedule:
    - cron: "0 5 * * 2"   # dienstags ca. 6:00 Uhr (Winterzeit) / 7:00 Uhr (Sommerzeit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abgleich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: nuLiga abgleichen
        run: node _bau/nuliga-stand.mjs
      - name: Änderung speichern
        run: |
          if git diff --quiet; then echo "Keine Änderung – nichts zu veröffentlichen."; exit 0; fi
          git config user.name "nuLiga-Abgleich"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Mannschaften: Stand aus nuLiga vom $(TZ=Europe/Berlin date +%d.%m.%Y)"
          git push
